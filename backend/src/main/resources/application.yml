spring:
  application:
    name: gridpulse
  datasource:
    url: jdbc:mysql://localhost:3306/gridpulse?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
    username: root
    password: Vamsi1122#
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

# Logging Configurations
logging:
  level:
    root: INFO
    com.gridpulse: DEBUG
    org.springframework.security: INFO

# Application Custom Configurations
gridpulse:
  jwt:
    # 256-bit secret key in base64 or plaintext
    secret: 9a67471a79b16bb185cfb52e399588b444747c32bf2542a1772f4e24cf8fef7f
    expiration-ms: 86400000 # 24 Hours
  dynamodb:
    # Set to true to use the local database or in-memory mock for high frequency telemetry.
    # Set to false to use actual Amazon DynamoDB (requires active AWS CLI credentials / environment configuration).
    mock: true
    aws:
      region: us-east-1
  groq:
    # Set your Groq API key here or as an environment variable GROQ_API_KEY.
    api-key: ${GROQ_API_KEY:}
    model: llama-3.3-70b-versatile
    url: https://api.groq.com/openai/v1

---
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:mem:gridpulse;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop

